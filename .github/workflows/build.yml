name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Android SDK, NDK and CMake
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Node.js for Android (nodejs-mobile)
        run: ./scripts/fetch-libnode.sh

      - name: SillyTavern bundle (patched + Elephant Memory + Elephant Stage)
        run: ./tavern/build-bundle.sh

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"; else NAME="0.1.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "ET_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "ET_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ET_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ET_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD secrets are not set — this APK uses a throwaway debug key and will not install over other builds."
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "elephant-tavern-${{ steps.v.outputs.name }}.apk"
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elephant-tavern-${{ steps.v.outputs.name }}
          path: elephant-tavern-*.apk
          compression-level: 0

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: elephant-tavern-*.apk
          generate_release_notes: true
